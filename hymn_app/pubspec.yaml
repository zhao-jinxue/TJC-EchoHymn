name: echo_hymn
description: "EchoHymn - 赞美诗与颂歌（Flutter + C++ 原生）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  ffi: ^2.1.2
  path_provider: ^2.1.3
  # 音频播放（DeviceFileSource 直读文件路径，规避中文路径 URI 编码问题）
  audioplayers: ^6.1.0
  # 本地 SQLite（跨平台：Windows/Linux 直接打开文件，Android/iOS 由 sqlite3_flutter_libs 提供原生库）
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  # 简繁转换（纯 Dart 映射表，无原生依赖；见 lib/data/chinese_convert_map.dart）
  # 已弃用 OpenCC FFI（本机 DLL 与 UI 线程不兼容）
  # 本地状态持久化（记住上次歌单/音频版本/歌词版本）
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hymns.json
