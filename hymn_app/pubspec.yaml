name: echo_hymn
description: "EchoHymn - 赞美诗与颂歌（Flutter + C++ 原生）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  ffi: ^2.1.2
  path_provider: ^2.1.3
  audio_session: ^0.1.21
  just_audio: ^0.9.39
  just_audio_windows: ^0.2.0
  # 本地 SQLite（跨平台：Windows/Linux 直接打开文件，Android/iOS 由 sqlite3_flutter_libs 提供原生库）
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  # 繁→简转换（OpenCC FFI，支持 Windows/Android/iOS/macOS/Web）
  flutter_opencc_ffi: ^0.0.3
  # 本地状态持久化（记住上次歌单/音频版本/歌词版本）
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hymns.json