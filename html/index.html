<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EchoHymn - 经典赞美诗与颂歌在线聆听" />
    <title>EchoHymn · 赞美诗与颂歌</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app">
        <!-- 侧边栏：诗歌列表 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">🎵 EchoHymn</h1>
                <p class="tagline">赞美诗与颂歌</p>
                <button class="icon-btn" id="sidebarToggle" aria-label="关闭侧边栏">✕</button>
            </div>

            <div class="search-box">
                <input type="search" id="searchInput" placeholder="搜索诗歌标题、编号…" />
            </div>

            <ul class="hymn-list" id="hymnList"></ul>
            <footer class="sidebar-footer">共 <span id="hymnCount">0</span> 首</footer>
        </aside>

        <!-- 主区域：详情 + 播放器 -->
        <main class="main">
            <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开侧边栏">☰</button>

            <section class="player" id="player">
                <!-- 默认状态 -->
                <div class="player-empty" id="playerEmpty">
                    <div class="empty-icon">🎶</div>
                    <p>从左侧选择一首诗歌开始聆听</p>
                </div>

                <!-- 播放状态 -->
                <div class="player-active hidden" id="playerActive">
                    <div class="music-note">🎼</div>
                    <h2 class="song-title" id="songTitle">—</h2>
                    <p class="song-meta" id="songMeta"></p>

                    <div class="progress-area">
                        <span id="currentTime">0:00</span>
                        <input type="range" id="progressBar" min="0" max="100" value="0" aria-label="播放进度" />
                        <span id="duration">0:00</span>
                    </div>

                    <div class="controls">
                        <button class="ctrl-btn" id="prevBtn" aria-label="上一首" title="上一首">⏮</button>
                        <button class="ctrl-btn play-btn" id="playBtn" aria-label="播放/暂停" title="播放">▶</button>
                        <button class="ctrl-btn" id="nextBtn" aria-label="下一首" title="下一首">⏭</button>
                    </div>

                    <div class="volume-row">
                        <span>🔈</span>
                        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" aria-label="音量" />
                        <span>🔊</span>
                    </div>
                </div>
            </section>

            <section class="lyrics" id="lyrics">
                <div class="lyrics-empty" id="lyricsEmpty">
                    <p>选择一首诗歌，歌词将显示在这里</p>
                </div>
            </section>
        </main>
    </div>

    <!-- 侧边栏遮罩（移动端） -->
    <div class="overlay hidden" id="overlay"></div>

    <script src="data/hymns.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
